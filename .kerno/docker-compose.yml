services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=outline"
      - "POSTGRES_PASSWORD=outline_password"
      - "POSTGRES_DB=outline"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U outline -d outline"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/outline?user=outline&password=outline_password

  redis:
    image: redis:8.4.0-alpine
    pull_policy: missing
    ports:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    labels:
      - external-url=redis://localhost:{{PORT}}

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    volumes:
      - outline-data:/var/lib/outline/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:3000/_health || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms

volumes:
  outline-data:
